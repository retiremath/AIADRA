[project]
name = "wedge"
version = "0.0.1"
description = "AIADRA Wedge-001 spike — throwaway implementation per ADR/0023"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "jsonschema>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wedge*"]
