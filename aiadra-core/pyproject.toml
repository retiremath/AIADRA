[project]
name = "aiadra-core"
version = "0.13.0"
description = "AIADRA Core — production-grade runtime for the Product Truth Model"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
aiadra = "aiadra_core.cli.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiadra_core*"]

[tool.setuptools.package-data]
aiadra_core = ["schemas/v*/*.json", "schemas/v*/**/*.json"]
