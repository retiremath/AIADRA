# AIADRA Knowledge Base — compatibility manifest (ADR/0037 D5).
#
# The KB is in-repo, git-tracked, plain-markdown-first, and RAG-consumed by ANY
# BYO-AI model — cloud frontier, local open-weights, or deterministic script
# (ADR/0026 §0). There is NO hosted KB service and NO AIADRA-operated embedding
# endpoint (Manifesto P11). Embedding/vector indexes are generated LOCAL
# artifacts, never source authority — git-ignored unless a future ADR changes
# the posture. The KB grows as a BY-PRODUCT of building features (ADR/0037 D8),
# never as documentation debt.
#
# Versioning is per-capability via this manifest, NOT lockstep with aiadra-core:
# engine feature semantics version with their engine (adapter schema), Ring 2
# command semantics version with core.

kb_version: "0.8.0"   # + sketch-placement page + golden recipe (flipped line: preview -> commit -> reopen) + parallel-reference repair trace; compatibility reconciled to the current runtime with the two record families named (arc 20260905-1 I3, Codex3 B4); prior 0.7.0: sketch-on-face (the face-plane binding, adapter 0.1.10 / Display v1.2 / core 0.15.0); prior 0.6.0: the sketch-plane binding (principal planes + normal± directions,
                      #   arc 20260714-2 EP2); 0.5.0 = contour; 0.4.0 = revolve;
                      #   0.3.0 = chamfer; 0.2.0 = hole; 0.1.0 = fillet

compatible:
  # Reconciled 2026-09-05 (arc 20260905-1, Codex3 B4): the KB as a whole is
  # validated against the CURRENT runtime by the `tests:` below (the full
  # mechanical suite passes on it). Two record families coexist:
  aiadra_core: ">=0.19.1,<0.20.0"
  # (1) the v1 recipe family (extrude/revolve/fillet/hole/chamfer/contour/
  #     sketch-plane/sketch-on-face pages): adapter 0.1.x records; authored at
  #     0.1.7–0.1.10, still valid at the current 0.1.11 — each page's tests
  #     pass unchanged, and the v1 writer keeps every pre-existing record's
  #     bytes (the pages' own `source_context` states the version they were
  #     written against).
  aiadra_mechanical_adapter_schema_version: ">=0.1.10,<0.2.0"
  # (2) the v2 constrained-sketch series (sketch-placement page + recipe +
  #     trace): explicit literal versions, never a range — 0.2.0 is immortal
  #     history, 0.2.1 = placed references sketches, 0.2.2 = drawn profiles.
  aiadra_mechanical_sketch_v2_series: ["0.2.1", "0.2.2"]

families:
  v1_recipe:
    pages: [features/fillet.md, features/hole.md, features/chamfer.md, features/revolve.md, features/contour.md, features/sketch-plane.md, features/sketch-on-face.md]
    persisted_as: "adapter_schema_version 0.1.x feature records"
  v2_sketch_series:
    pages: [features/sketch-placement.md, golden-recipes/sketch-placement-flipped-line.md, traces/sketch-placement-parallel-repair.md]
    persisted_as: "adapter_schema_version 0.2.1 / 0.2.2 sketch records (closed placement member)"

source_refs:
  adrs: ["ADR/0037", "ADR/0038", "ADR/0035", "ADR/0031", "ADR/0029", "ADR/0044"]
  schema_bundle: "v0.28.0"
  tests:
    - "aiadra-mechanical/tests/test_fillet_feature.py"
    - "aiadra-mechanical/tests/test_hole_feature.py"
    - "aiadra-mechanical/tests/test_chamfer_feature.py"
    - "aiadra-mechanical/tests/test_revolve_feature.py"
    - "aiadra-mechanical/tests/test_contour_extrude.py"
    - "aiadra-mechanical/tests/test_sketch_plane_matrix.py"
    - "aiadra-mechanical/tests/test_face_frame.py"
    - "aiadra-mechanical/tests/test_sketch_placement.py"
    - "aiadra-mechanical/tests/test_profile_sketch_ops.py"
    - "aiadra-studio/bridge/test_i3_placement_requests.py"

contents:
  feature_semantics:
    - features/fillet.md
    - features/hole.md
    - features/chamfer.md
    - features/revolve.md
    - features/contour.md
    - features/sketch-plane.md
