    - traces/sketch-placement-parallel-repair.md

retrieval_tags: [mechanical, feature, fillet, round, hole, chamfer, bevel, revolve, surface-of-revolution, tube, contour, closed-ring, profile, segment, sketch-plane, principal-plane, frame, normal, creation, face-reference, edge-reference, reference-identity, regeneration, paradigm, sketch-placement, orientation-reference, flip, normal-side, sketch-view, v2]

firewall:
  # ADR/0037 D3 — original-content discipline (clean-room-style). Every shippable
  # KB artifact cites AIADRA artifacts (ADRs / schema / engine handlers / tests /
  # golden recipes) as its authority; NO proprietary documentation is ever in the
  # producing context of a shippable artifact, and none is mirrored in structure
  # or expression. Each artifact carries a `source_context` attestation (D7).
  original_content_discipline: true
